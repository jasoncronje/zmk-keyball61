# Host Bluetooth connection parameters (the split link has its own, ZMK_SPLIT_BLE_PREF_*).
# Interval unit: 1.25 ms. Fixed 12 = 15 ms, the one fixed interval Apple's accessory
# rules allow (otherwise min >= 15 ms, max >= min + 15 ms). A 15-30 ms range let
# macOS pick up to 30 ms, which made the trackball laggy and stuttery. macOS ignores
# a fixed 7.5 ms or 11.25 ms request entirely (bluetoothd logs), leaving its own
# 15 ms, latency 22 and 2 s timeout instead of the latency and timeout below.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# Latency unit: connection intervals.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
# Supervision timeout, unit: 10 ms. 400 = 4 s instead of Zephyr's 420 ms default,
# so the right half can miss a few host slots while it also serves the split link
# without macOS dropping the connection.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Mouse reports waiting for the host link (ZMK default 20). Each one is sent in
# order, so a full queue keeps the pointer that many reports behind the ball.
# A short queue keeps it current. When full, ZMK waits up to 100 ms for room,
# then drops the oldest report, so only a stalled link loses movement.
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=4
# One mouse report on the air at a time; movement that arrives meanwhile is added
# into the next one, so each 15 ms host slot carries one report with everything
# since the last. Lets the sensor run at 250 Hz without a backlog (see the right
# .conf). The queue size above then only bounds reports with different buttons.
CONFIG_ZMK_BLE_MOUSE_REPORT_COALESCE=y

# Enable auto-sleeping after being idle for 1 hour (unit: ms).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Set transmission power to max (+8dBm). Improves connection stability.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Our own status screen (modules/status-screen) in its nice!view layout, in
# place of the nice_view shield's widget
CONFIG_KEYBALL61_STATUS_SCREEN=y
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# Run display on its own thread to avoid typing latency
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10

CONFIG_ZMK_EXT_POWER=y
