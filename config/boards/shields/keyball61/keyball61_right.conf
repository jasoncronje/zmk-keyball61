CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

# --- PMW3610 Driver Configuration ---
CONFIG_PMW3610=y
# Default trackball sensitivity (CPI/DPI). Higher = faster.
CONFIG_PMW3610_CPI=800
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
# Scroll speed divisor. Higher = slower scrolling.
CONFIG_PMW3610_SCROLL_TICK=32
# Invert scroll direction.
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
# Enable smart algorithm for smoother movement.
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
# Polling rate. Lower polling rate (125Hz) saves battery.
# Debug: off. It holds each reading and drops it unless another arrives within 128 ms
#CONFIG_PMW3610_POLLING_RATE_125_SW=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- Debug branch: log over USB ---
# Every input event the sensor driver produces (type, code, value)
CONFIG_INPUT_EVENT_DUMP=y
# The PMW3610 driver logs under the input subsystem's level: init steps, SPI errors
CONFIG_INPUT_LOG_LEVEL_DBG=y
# ZMK: temp-layer activations, HID reports, endpoint changes
CONFIG_ZMK_LOG_LEVEL_DBG=y
# Hold logs for 8 s after boot, so the sensor's init is still there when the port opens
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
# The usb-logging snippet takes the USB serial port Studio would use
CONFIG_ZMK_STUDIO=n
