CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

# --- PMW3610 Driver Configuration ---
CONFIG_PMW3610=y
# Default trackball sensitivity (CPI/DPI). Higher = faster.
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
# Scroll speed divisor. Higher = slower scrolling.
CONFIG_PMW3610_SCROLL_TICK=48
# Invert scroll direction.
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
# Enable smart algorithm for smoother movement.
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
# Polling rate: 250 Hz in the sensor (driver default, set explicitly). The sensor
# adds up movement between reads, so nothing is lost. At 125 Hz each 15 ms host
# slot got 1 or 2 readings (8 ms vs 15 ms), uneven steps that felt choppy; at
# 250 Hz it is 3 or 4. Without CONFIG_ZMK_BLE_MOUSE_REPORT_COALESCE
# (keyball61_nv.conf) 250 Hz queued ~4 reports per slot, more than the link
# sends, and the pointer trailed the ball; with it they are merged into one.
# Not PMW3610_POLLING_RATE_125_SW: it holds each reading and drops it unless
# another arrives within 128 ms, so slow and soft rolls lost most of their movement.
CONFIG_PMW3610_POLLING_RATE_250=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
