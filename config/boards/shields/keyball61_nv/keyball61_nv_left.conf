# Switch the Touch ID board off 15 min after the last left-half key press
# (modules/touchid-power; its boost's En pad is wired to pm9, the B5 pad). The delay
# counts from ZMK's 30 s idle. Once off, the board only reconnects after its
# sensor is clicked, so keep this long. Plugging in USB switches it to
# always-on until unplugged; FUNCTION + T cycles auto/on/off.
CONFIG_KEYBALL61_TOUCHID_POWER=y
CONFIG_KEYBALL61_TOUCHID_OFF_DELAY_SEC=870
