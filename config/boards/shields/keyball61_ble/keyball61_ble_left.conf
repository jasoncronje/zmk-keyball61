# Switch the Touch ID board off 15 min after the last left-half key press
# (modules/touchid-power; the on-board TPS61023 boost's EN is on pm9, see the
# left overlay). The delay counts from ZMK's 30 s idle. Once off, the board
# only reconnects after its sensor is clicked, so keep this long.
CONFIG_KEYBALL61_TOUCHID_POWER=y
CONFIG_KEYBALL61_TOUCHID_OFF_DELAY_SEC=870
